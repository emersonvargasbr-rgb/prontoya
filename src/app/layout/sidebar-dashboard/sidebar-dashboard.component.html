<!-- EN PANTALLAS GRANDES (PC / Tablet): Se muestra como barra lateral -->
<aside class="hidden md:flex w-64 bg-gray-900 text-gray-300 flex-col h-screen fixed left-0 top-0 border-r border-gray-800 z-50">
  <div class="p-6 border-b border-gray-800 flex items-center justify-between">
    <span class="text-xl font-black text-white tracking-wider">COSTURAPRONTA</span>
  </div>

  <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
    <p class="px-3 text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Menú Principal</p>

    <a routerLink="/feed" routerLinkActive="bg-gray-800 text-white" class="flex items-center px-4 py-3 rounded-xl hover:bg-gray-800 hover:text-white transition font-medium text-sm">
      <svg class="w-5 h-5 mr-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
      Feed de Trabajos
    </a>

    <ng-container *ngIf="!cargando">
      <a *ngIf="rolUsuario === 'tienda'" routerLink="/panel-tienda" routerLinkActive="bg-gray-800 text-white" class="flex items-center px-4 py-3 rounded-xl hover:bg-gray-800 hover:text-white transition font-medium text-sm">
        <svg class="w-5 h-5 mr-3 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        Panel Tienda
      </a>

      <a *ngIf="rolUsuario === 'oficina'" routerLink="/panel-oficina" routerLinkActive="bg-gray-800 text-white" class="flex items-center px-4 py-3 rounded-xl hover:bg-gray-800 hover:text-white transition font-medium text-sm">
        <svg class="w-5 h-5 mr-3 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
        Panel Taller / Oficina
      </a>

      <a *ngIf="rolUsuario === 'funcionario'" routerLink="/panel-funcionario" routerLinkActive="bg-gray-800 text-white" class="flex items-center px-4 py-3 rounded-xl hover:bg-gray-800 hover:text-white transition font-medium text-sm">
        <svg class="w-5 h-5 mr-3 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        Panel Operario
      </a>
    </ng-container>

    <a routerLink="/editar-perfil" routerLinkActive="bg-gray-800 text-white" class="flex items-center px-4 py-3 rounded-xl hover:bg-gray-800 hover:text-white transition font-medium text-sm">
      <svg class="w-5 h-5 mr-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
      Mi Perfil / Máquinas
    </a>
  </nav>

  <div class="p-4 border-t border-gray-800">
    <button (click)="cerrarSesion()" class="w-full flex items-center px-4 py-3 rounded-xl text-red-400 hover:bg-red-500/10 transition font-medium text-sm">
      <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
      Cerrar Sesión
    </button>
  </div>
</aside>

<!-- EN CELULARES (MOBILE BOTTOM NAVBAR TIPO APP ANDROID): Barra fija abajo -->

  <!-- Feed -->
  <a routerLink="/feed" routerLinkActive="text-blue-400" class="flex flex-col items-center justify-center flex-1 py-1 text-xs font-medium">
    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>

      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>

    </a>

    <a *ngIf="rolUsuario === 'oficina'" routerLink="/panel-oficina" routerLinkActive="text-blue-400" class="flex flex-col items-center justify-center flex-1 py-1 text-xs font-medium">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>

    </a>

    <a *ngIf="rolUsuario === 'funcionario'" routerLink="/panel-funcionario" routerLinkActive="text-blue-400" class="flex flex-col items-center justify-center flex-1 py-1 text-xs font-medium">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>

    </a>
  </ng-container>

  <!-- Editar Perfil -->
  <a routerLink="/editar-perfil" routerLinkActive="text-blue-400" class="flex flex-col items-center justify-center flex-1 py-1 text-xs font-medium">
    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
