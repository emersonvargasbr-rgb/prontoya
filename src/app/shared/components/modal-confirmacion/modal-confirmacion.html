<div *ngIf="isOpen" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
  <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 transform transition-all animate-in fade-in zoom-in duration-200">
    
    <div class="flex items-center space-x-3 mb-4">
      <div class="w-10 h-10 rounded-full bg-red-100 flex items-center justify-center text-red-600 flex-shrink-0">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
      </div>
      <div>
        <h3 class="text-lg font-bold text-gray-900">{{ titulo }}</h3>
      </div>
    </div>

    <p class="text-sm text-gray-600 mb-6">{{ mensaje }}</p>

    <div class="flex space-x-3 justify-end">
      <button (click)="cancelar()" class="px-4 py-2.5 rounded-xl border border-gray-300 text-gray-700 font-bold text-sm hover:bg-gray-50 transition">
        Cancelar
      </button>
      <button (click)="confirmar()" class="px-4 py-2.5 rounded-xl bg-red-600 text-white font-bold text-sm hover:bg-red-700 transition shadow-md shadow-red-200">
        {{ textoBotonConfirmar }}
      </button>
    </div>

  </div>
</div>
