<nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16">
      
      <!-- Lado Izquierdo: Logo y links principales -->
      <div class="flex items-center">
        <!-- Logo de la app -->
        <a routerLink="/" class="flex-shrink-0 flex items-center cursor-pointer">
          <svg class="w-8 h-8 text-blue-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
          <span class="font-black text-xl text-gray-900 tracking-tight">Costura<span class="text-blue-600">Pronta</span></span>
        </a>

        <!-- Links públicos (Solo se muestran si están logueados) -->
        <div *ngIf="usuarioLogueado" class="hidden sm:ml-8 sm:flex sm:space-x-8">
          <a routerLink="/feed" routerLinkActive="border-blue-500 text-gray-900" 
             class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium transition-colors">
            Feed de Cortes
          </a>
          <a routerLink="/editar-perfil" class="text-sm font-medium text-gray-500 hover:text-gray-900 transition-colors ml-4 mr-2">
  Mi CV / Perfil
</a>
        </div>
      </div>

      <!-- Lado Derecho: Botones de Auth y Panel -->
      <div class="flex items-center space-x-4">
        
        <!-- Vista para Usuarios NO logueados -->
        <ng-container *ngIf="!usuarioLogueado">
          <a routerLink="/login" class="text-sm font-medium text-gray-600 hover:text-gray-900 transition-colors">
            Iniciar Sesión
          </a>
          <a routerLink="/registro" class="bg-blue-600 text-white text-sm font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition-colors shadow-sm">
            Regístrate Gratis
          </a>
          
        </ng-container>

        <!-- Vista para Usuarios SÍ logueados -->
        <ng-container *ngIf="usuarioLogueado">
          <a [routerLink]="rutaPanel" 
             class="bg-gray-100 text-gray-800 text-sm font-bold py-2 px-4 rounded-lg hover:bg-gray-200 transition-colors border border-gray-200">
            Mi Panel
          </a>
          <button (click)="cerrarSesion()" class="text-sm font-medium text-red-500 hover:text-red-700 transition-colors ml-4">
            Salir
          </button>
        </ng-container>
        
      </div>
    </div>
  </div>
</nav>
