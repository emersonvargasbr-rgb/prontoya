<nav class="bg-white/90 backdrop-blur-md border-b border-slate-100 sticky top-0 z-40 shadow-xs transition-all duration-300 md:ml-20">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16 items-center">
      <!-- Lado Izquierdo: Logo y Enlaces Principales -->
      <div class="flex items-center gap-8">
        <!-- Logo CosturaPronta Pro -->
        <a routerLink="/" class="flex items-center gap-2.5 group cursor-pointer">
          <div class="w-9 h-9 rounded-xl bg-slate-900 text-white flex items-center justify-center font-black shadow-md group-hover:scale-105 transition">
            🧵
          </div>
          <div class="flex flex-col">
            <span class="font-black text-base text-slate-900 tracking-tight leading-none">Costura<span class="text-blue-600">Pronta</span></span>
            <span class="text-[9px] font-extrabold text-slate-400 tracking-wider uppercase">São Paulo SP</span>
          </div>
        </a>

        <!-- Links de Navegación (Desktop) -->
        <div *ngIf="usuarioLogueado" class="hidden md:flex items-center space-x-1">
          <a routerLink="/feed" routerLinkActive="bg-slate-100 text-slate-900 font-extrabold" 
             class="text-slate-600 hover:text-slate-900 hover:bg-slate-50 text-xs font-bold px-3.5 py-2 rounded-xl transition">
            Feed de Cortes
          </a>
          <a routerLink="/editar-perfil" routerLinkActive="bg-slate-100 text-slate-900 font-extrabold"
             class="text-slate-600 hover:text-slate-900 hover:bg-slate-50 text-xs font-bold px-3.5 py-2 rounded-xl transition">
            Mi Perfil / CV
          </a>
        </div>
      </div>

      <!-- Lado Derecho: Autenticación / Acciones (Desktop) -->
      <div class="hidden md:flex items-center gap-3">
        
        <!-- Estado NO Logueado -->
        <ng-container *ngIf="!usuarioLogueado">
          <a routerLink="/login" class="text-xs font-bold text-slate-600 hover:text-slate-900 px-4 py-2.5 transition">
            Iniciar Sesión
          </a>
          <a routerLink="/registro" class="bg-blue-600 hover:bg-blue-700 active:scale-95 text-white text-xs font-extrabold py-2.5 px-4 rounded-xl shadow-lg shadow-blue-200 transition">
            Regístrate Gratis
          </a>
        </ng-container>

        <!-- Estado SÍ Logueado -->
        <ng-container *ngIf="usuarioLogueado">
          <a [routerLink]="rutaPanel" 
             class="bg-slate-900 hover:bg-slate-800 active:scale-95 text-white text-xs font-extrabold py-2.5 px-4 rounded-xl shadow-md transition flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
            Mi Panel
          </a>
          
          <div class="h-4 w-[1px] bg-slate-200 mx-1"></div>

          <button (click)="cerrarSesion()" class="text-xs font-bold text-rose-500 hover:text-rose-700 hover:bg-rose-50 px-3 py-2 rounded-xl transition">
            Salir
          </button>
        </ng-container>

      </div>

      <!-- Botón Menú Hamburguesa (Móvil) -->
      <div class="flex md:hidden items-center">
        <button (click)="toggleMenuMobile()" class="p-2 rounded-xl bg-slate-100 text-slate-700 hover:bg-slate-200 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path *ngIf="!menuMobileAbierto" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"></path>
            <path *ngIf="menuMobileAbierto" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>

    </div>
  </div>

  <!-- Menú Desplegable Móvil -->
  <div *ngIf="menuMobileAbierto" class="md:hidden bg-white border-b border-slate-100 px-4 pt-2 pb-4 space-y-2 animate-in slide-in-from-top duration-150">
    <ng-container *ngIf="usuarioLogueado">
      <a routerLink="/feed" (click)="menuMobileAbierto = false" class="block py-2.5 px-3 rounded-xl text-xs font-bold text-slate-700 hover:bg-slate-50">
        📋 Feed de Cortes
      </a>
      <a routerLink="/editar-perfil" (click)="menuMobileAbierto = false" class="block py-2.5 px-3 rounded-xl text-xs font-bold text-slate-700 hover:bg-slate-50">
        👤 Mi Perfil / CV
      </a>
      <a [routerLink]="rutaPanel" (click)="menuMobileAbierto = false" class="block py-2.5 px-3 rounded-xl text-xs font-bold bg-slate-900 text-white text-center">
        ⚡ Ir a Mi Panel
      </a>
      <button (click)="cerrarSesion()" class="w-full text-left py-2.5 px-3 rounded-xl text-xs font-bold text-rose-600 hover:bg-rose-50">
        🚪 Cerrar Sesión
      </button>
    </ng-container>

    <ng-container *ngIf="!usuarioLogueado">
      <a routerLink="/login" (click)="menuMobileAbierto = false" class="block py-2.5 px-3 rounded-xl text-xs font-bold text-slate-700 hover:bg-slate-50">
        Iniciar Sesión
      </a>
      <a routerLink="/registro" (click)="menuMobileAbierto = false" class="block py-3 px-3 rounded-xl text-xs font-extrabold bg-blue-600 text-white text-center shadow-md">
        Regístrate Gratis
      </a>
    </ng-container>
  </div>
</nav>
