<!--
  Altura fija h-16 = var(--header-h). El sidebar y los avisos se colocan debajo usando esa variable.
  Ya no lleva "md:ml-20": el sidebar está en el flujo, no flotando encima.
-->
<header class="sticky top-0 z-40 h-16 border-b border-stone-200 bg-white/90 backdrop-blur">
  <div class="mx-auto flex h-full max-w-7xl items-center justify-between gap-4 px-4 sm:px-6 lg:px-8">

    <!-- Logo -->
    <a routerLink="/" class="group flex items-center gap-2.5 rounded-lg focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-600" aria-label="CosturaPronta, ir al inicio">
      <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-teal-700 text-white transition group-hover:bg-teal-800">
        <app-icon nombre="scissors" clase="w-5 h-5" />
      </span>
      <span class="leading-tight">
        <span class="block text-base font-bold tracking-tight text-slate-900">Costura<span class="text-teal-700">Pronta</span></span>
        <span class="block text-[11px] text-slate-500">São Paulo, SP</span>
      </span>
    </a>

    <div class="flex items-center gap-2 sm:gap-3">

      <!-- ===================================================== INVITADO -->
      <ng-container *ngIf="!sesion.logueado() && !sesion.cargando()">
        <a routerLink="/login" [ngClass]="ui.btnSecundario" class="!border-transparent !bg-transparent">Iniciar sesión</a>
        <a routerLink="/registro" [ngClass]="ui.btnPrimario"><span class="hidden sm:inline">Regístrate gratis</span><span class="sm:hidden">Registrarme</span></a>
      </ng-container>

      <!-- ===================================================== CON SESIÓN -->
      <ng-container *ngIf="sesion.logueado()">

       <a routerLink="/crear-publicacion" [ngClass]="ui.btnPrimario" class="inline-flex items-center justify-center p-2.5 md:px-4 md:py-2">
  <app-icon nombre="plus" clase="w-4 h-4" />
  <span class="hidden md:inline ml-2">Publicar</span>
</a>

        <!-- Pendientes -->
        <a [routerLink]="sesion.rutaPanel()" class="relative rounded-lg p-2 text-slate-600 transition hover:bg-stone-100 hover:text-slate-900 focus-visible:outline focus-visible:outline-2 focus-visible:outline-teal-600"
           [attr.aria-label]="sesion.pendientes() ? sesion.pendientes() + ' solicitudes pendientes' : 'Sin solicitudes pendientes'">
          <app-icon nombre="bell" clase="w-5 h-5" />
          <span *ngIf="sesion.pendientes() > 0" class="absolute -right-0.5 -top-0.5 min-w-[1.125rem] rounded-full bg-rose-600 px-1 text-center text-[10px] font-bold leading-[1.125rem] text-white">
            {{ sesion.pendientes() > 9 ? '9+' : sesion.pendientes() }}
          </span>
        </a>

        <!-- Menú de usuario -->
        <div class="relative">
          <button type="button" (click)="alternarMenu()" id="boton-usuario" aria-haspopup="menu" [attr.aria-expanded]="menuAbierto()" aria-controls="menu-usuario"
                  class="flex items-center gap-2 rounded-lg p-1 pr-2 transition hover:bg-stone-100 focus-visible:outline focus-visible:outline-2 focus-visible:outline-teal-600">
            <ng-container *ngIf="sesion.usuario() as u">
              <app-avatar [nombre]="u.nombre_completo" tamano="sm" [icono]="u.avatar_icono" [color]="u.avatar_color" />
              <span class="hidden max-w-[10rem] truncate text-sm font-semibold text-slate-800 lg:block">{{ u.nombre_completo }}</span>
            </ng-container>
            <app-icon nombre="chevron-down" clase="w-4 h-4 text-slate-500 transition-transform" [class.rotate-180]="menuAbierto()" />
          </button>

          <div *ngIf="menuAbierto()" id="menu-usuario" role="menu" aria-labelledby="boton-usuario"
               class="absolute right-0 mt-2 w-64 origin-top-right overflow-hidden rounded-xl border border-stone-200 bg-white shadow-lg">

            <div *ngIf="sesion.usuario() as u" class="border-b border-stone-100 p-4">
              <p class="truncate text-sm font-bold">{{ u.nombre_completo }}</p>
              <p class="mt-0.5 text-xs text-slate-500">{{ roles[u.rol]?.txt }}</p>
              <span *ngIf="sesion.g() as x" class="mt-2 inline-flex items-center gap-1.5 rounded-md px-2 py-1 text-[11px] font-semibold" [ngClass]="x.claseNivel">
                <app-icon nombre="flag" clase="w-3 h-3" /> Nivel {{ x.nivel }} · {{ x.nombre }}
              </span>
            </div>

            <div class="p-1.5">
              <a *ngIf="sesion.usuario() as u" [routerLink]="[rutaPerfil, u.id]" role="menuitem" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-700 hover:bg-stone-100">
                <app-icon nombre="user" clase="w-4 h-4 text-slate-500" /> Mi perfil
              </a>
              <a [routerLink]="sesion.rutaPanel()" role="menuitem" class="flex items-center justify-between gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-700 hover:bg-stone-100">
                <span class="flex items-center gap-3"><app-icon nombre="layers" clase="w-4 h-4 text-slate-500" /> Mi panel</span>
                <span *ngIf="sesion.pendientes() > 0" class="rounded-full bg-rose-600 px-1.5 text-[11px] font-bold text-white">{{ sesion.pendientes() }}</span>
              </a>
              <a routerLink="/editar-perfil" role="menuitem" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-700 hover:bg-stone-100">
                <app-icon nombre="cog" clase="w-4 h-4 text-slate-500" /> Editar perfil
              </a>
            </div>

            <div class="border-t border-stone-100 p-1.5">
              <button type="button" role="menuitem" (click)="cerrarSesion()" class="flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-rose-700 hover:bg-rose-50">
                <app-icon nombre="logout" clase="w-4 h-4" /> Cerrar sesión
              </button>
            </div>
          </div>
        </div>
      </ng-container>

    </div>
  </div>
</header>
