<div class="min-h-screen bg-gray-50 py-10 px-4">
  <div class="max-w-md mx-auto bg-white rounded-2xl shadow-sm border border-gray-200 p-8">
    
    <h2 class="text-2xl font-bold text-center text-gray-900 mb-2">Calificar Usuario</h2>
    <p class="text-center text-sm text-gray-500 mb-8">Tu reseña es pública y ayuda a otros a hacer negocios seguros.</p>

    <div *ngIf="mensaje" class="bg-red-50 text-red-600 p-3 rounded-lg text-sm font-medium mb-6 text-center">
      {{ mensaje }}
    </div>

    <!-- 1. Selector Interactivo de Estrellas -->
    <div class="mb-8">
      <label class="block text-sm font-bold text-gray-700 text-center mb-3">¿Cómo fue tu experiencia?</label>
      <div class="flex justify-center space-x-2">
        <!-- Generamos 5 botones invisibles con forma de estrella -->
        <button *ngFor="let e of [1,2,3,4,5]" 
                (click)="seleccionarEstrella(e)"
                class="focus:outline-none transition-transform hover:scale-110">
          <svg class="w-12 h-12" 
               [ngClass]="e <= estrellasSeleccionadas ? 'text-yellow-400' : 'text-gray-200'"
               fill="currentColor" viewBox="0 0 20 20">
            <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- 2. Etiquetas Rápidas (Chips) -->
    <div class="mb-8">
      <label class="block text-sm font-bold text-gray-700 mb-3">Destaca lo más importante</label>
      <div class="flex flex-wrap gap-2">
        <button *ngFor="let etiqueta of etiquetasDisponibles"
                (click)="toggleEtiqueta(etiqueta)"
                type="button"
                [ngClass]="etiquetasSeleccionadas.includes(etiqueta) ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-600 border-gray-300'"
                class="border px-4 py-2 rounded-full text-sm font-medium transition-colors">
          {{ etiqueta }}
        </button>
      </div>
    </div>

    <!-- 3. Comentario Escrito -->
    <div class="mb-8">
      <label class="block text-sm font-bold text-gray-700 mb-2">Comentario adicional (Opcional)</label>
      <textarea [(ngModel)]="comentario" rows="3" 
                placeholder="Ej: Cumplió con los tiempos pero la costura recta falló un poco en algunas prendas..."
                class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
    </div>

    <!-- Botón de Envío -->
    <button (click)="enviarEvaluacion()" 
            [disabled]="cargando || estrellasSeleccionadas === 0"
            class="w-full bg-gray-900 text-white font-bold py-4 px-4 rounded-xl hover:bg-gray-800 transition duration-200 disabled:opacity-50">
      {{ cargando ? 'Guardando...' : 'Publicar Reseña' }}
    </button>

  </div>
</div>
