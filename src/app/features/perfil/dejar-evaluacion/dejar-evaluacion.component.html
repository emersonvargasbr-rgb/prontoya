<div class="min-h-screen bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-xl mx-auto bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden p-8">
    
    <div class="text-center mb-8">
      <h1 class="text-2xl font-black text-gray-900">Calificar a {{ evaluadoNombre }}</h1>
      <p class="text-gray-500 text-sm mt-1">Tu opinión ayuda a mantener la confianza y calidad en la comunidad textil.</p>
    </div>

    <div *ngIf="mensajeError" class="bg-red-50 text-red-600 p-3 rounded-xl text-sm font-medium mb-6 border border-red-100 text-center">
      {{ mensajeError }}
    </div>

    <div class="space-y-6">
      
      <!-- Selector de Estrellas -->
      <div class="text-center space-y-2">
        <label class="block text-sm font-bold text-gray-700 uppercase tracking-wider">Puntuación General</label>
        <div class="flex justify-center gap-2">
          <button *ngFor="let star of [1, 2, 3, 4, 5]" (click)="seleccionarEstrellas(star)" type="button"
            class="text-4xl transition transform hover:scale-110 focus:outline-none"
            [class.text-yellow-400]="star <= estrellas"
            [class.text-gray-300]="star > estrellas">
            ★
          </button>
        </div>
        <p class="text-xs font-bold text-gray-500">{{ estrellas }} de 5 estrellas</p>
      </div>

      <!-- Etiquetas Rápidas -->
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-2">Destaca aspectos positivos (Opcional)</label>
        <div class="flex flex-wrap gap-2">
          <button *ngFor="let etiqueta of etiquetasDisponibles" (click)="toggleEtiqueta(etiqueta)" type="button"
            [class.bg-blue-600]="etiquetasSeleccionadas.includes(etiqueta)"
            [class.text-white]="etiquetasSeleccionadas.includes(etiqueta)"
            [class.bg-gray-100]="!etiquetasSeleccionadas.includes(etiqueta)"
            [class.text-gray-700]="!etiquetasSeleccionadas.includes(etiqueta)"
            class="text-xs font-bold px-3 py-2 rounded-xl transition">
            {{ etiqueta }}
          </button>
        </div>
      </div>

      <!-- Comentario Opcional -->
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">Comentario detallado</label>
        <textarea [(ngModel)]="comentario" rows="4" placeholder="Escribe tu experiencia trabajando con este taller o tienda..."
          class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
      </div>

      <!-- Botón de Envío -->
      <button (click)="enviarEvaluacion()" [disabled]="cargando"
        class="w-full bg-gray-900 hover:bg-gray-800 text-white font-bold py-4 rounded-xl transition shadow-lg disabled:opacity-50">
        {{ cargando ? 'Enviando...' : 'Enviar Calificación' }}
      </button>

    </div>

  </div>
</div>
