<div class="min-h-screen bg-slate-50/70 py-6 px-3 sm:px-6 flex justify-center items-start">
  <div class="w-full max-w-xl bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 overflow-hidden transition-all">
    
    <!-- HEADER ESTILO MOBILE APP -->
    <div class="px-6 pt-6 pb-4 border-b border-slate-100 flex items-center justify-between bg-white">
      <div>
        <span class="text-xs font-bold tracking-wider uppercase text-blue-600 bg-blue-50 px-2.5 py-1 rounded-full">CosturaPronta ERP</span>
        <h2 class="text-2xl font-black text-slate-900 mt-1 tracking-tight">Nuevo Anuncio</h2>
      </div>
      <div class="w-10 h-10 rounded-2xl bg-slate-100 flex items-center justify-center text-slate-500 font-bold text-sm">
        ✨
      </div>
    </div>

    <div class="p-6">
      <!-- PANTALLA DE ÉXITO ESTILO MOBILE -->
      <div *ngIf="publicacionExitosa" class="text-center py-6 space-y-4 animate-fadeIn">
        <div class="mx-auto flex items-center justify-center h-20 w-20 rounded-full bg-emerald-50 text-emerald-500 ring-8 ring-emerald-50/50">
          <svg class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
          </svg>
        </div>
        <div>
          <h3 class="text-xl font-black text-slate-900">¡Anuncio Publicado!</h3>
          <p class="text-sm text-slate-500 mt-1">Listo para compartir en redes sociales y grupos de WhatsApp.</p>
        </div>
        
        <div class="bg-slate-50 p-4 rounded-2xl text-left text-xs text-slate-700 font-mono border border-slate-200/80 whitespace-pre-line shadow-inner max-h-60 overflow-y-auto">
          {{ textoGenerado }}
        </div>

        <button (click)="copiarAlPortapapeles()" 
          class="w-full bg-slate-900 active:scale-[0.98] text-white font-bold py-4 px-6 rounded-2xl shadow-lg shadow-slate-900/20 hover:bg-slate-800 transition duration-200 flex items-center justify-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
          Copiar Texto y Volver
        </button>
      </div>

      <!-- FORMULARIO PRINCIPAL -->
      <form *ngIf="!publicacionExitosa" (ngSubmit)="onSubmit()" #pubForm="ngForm" class="space-y-6">
        
        <div *ngIf="mensajeError" class="bg-rose-50 text-rose-600 p-4 rounded-2xl text-xs font-semibold border border-rose-100 flex items-center gap-2">
          <span>⚠️</span> {{ mensajeError }}
        </div>

        <!-- SELECTOR DE ROL / OBJETIVO (CARDS SELECCIONABLES ESTILO ANDROID) -->
        <div class="space-y-2">
          <label class="text-xs font-bold uppercase tracking-wider text-slate-400">¿Qué buscas publicar?</label>
          
          <!-- Si es OFICINA: Selector táctil con Tabs -->
          <div *ngIf="rolUsuario === 'oficina'" class="grid grid-cols-2 gap-2 bg-slate-100/80 p-1.5 rounded-2xl border border-slate-200/60">
            <button type="button" 
              (click)="publicacion.tipo_publicacion = 'busco_corte'"
              [class.bg-white]="publicacion.tipo_publicacion === 'busco_corte'"
              [class.shadow-md]="publicacion.tipo_publicacion === 'busco_corte'"
              [class.text-blue-700]="publicacion.tipo_publicacion === 'busco_corte'"
              class="py-3 px-3 rounded-xl font-bold text-xs text-slate-600 transition duration-200 flex flex-col items-center justify-center gap-1">
              <span class="text-base">✂️</span>
              <span>Taller Libre (Busco Corte)</span>
            </button>

            <button type="button" 
              (click)="publicacion.tipo_publicacion = 'busco_funcionario'"
              [class.bg-white]="publicacion.tipo_publicacion === 'busco_funcionario'"
              [class.shadow-md]="publicacion.tipo_publicacion === 'busco_funcionario'"
              [class.text-blue-700]="publicacion.tipo_publicacion === 'busco_funcionario'"
              class="py-3 px-3 rounded-xl font-bold text-xs text-slate-600 transition duration-200 flex flex-col items-center justify-center gap-1">
              <span class="text-base">👥</span>
              <span>Contratar Costureros</span>
            </button>
          </div>

          <!-- Si es TIENDA u OPERARIO -->
          <div *ngIf="rolUsuario === 'tienda'" class="p-4 bg-blue-50/60 rounded-2xl border border-blue-100/80 text-xs font-semibold text-blue-900 flex items-center gap-3">
            <span class="text-xl">🏪</span>
            <span><strong>Modo Tienda:</strong> Publica un lote para adjudicar a un taller calificado.</span>
          </div>

          <div *ngIf="rolUsuario === 'funcionario'" class="p-4 bg-purple-50/60 rounded-2xl border border-purple-100/80 text-xs font-semibold text-purple-900 flex items-center gap-3">
            <span class="text-xl">👤</span>
            <span><strong>Modo Operario:</strong> Publica tu disponibilidad para talleres textiles.</span>
          </div>
        </div>

        <!-- ========================================================================= -->
        <!-- CASO A: OFICINA OFRECE TALLER LIBRE (BUSCO CORTE DE TIENDA)              -->
        <!-- ========================================================================= -->
        <div *ngIf="publicacion.tipo_publicacion === 'busco_corte'" class="space-y-4 animate-fadeIn">
          
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Título / Nombre del Servicio</label>
            <input type="text" [(ngModel)]="publicacion.titulo" name="tituloCorte" placeholder="Ej: Taller disponible para confección de remeras" required
              class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-medium focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition">
          </div>

          <!-- Especialidad y Tejido -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-slate-600 uppercase mb-1">🛠️ Especialidad del Taller</label>
              <select [(ngModel)]="publicacion.especialidad_taller" name="espTaller" required
                class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-medium focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none transition">
                <option value="Costura y Confeccion Completa">Costura & Confección Completa</option>
                <option value="Oficina de Corte">Oficina de Corte</option>
                <option value="Caseadeira y Botoneira">Caseadeira & Botoneira</option>
                <option value="Estampado y Sublimacion">Estampado & Sublimación</option>
                <option value="Acabados y Plancha">Acabados & Plancha</option>
                <option value="Empaque y Etiquetado">Empaque & Etiquetado</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-600 uppercase mb-1">🧵 Tipo de Tejido</label>
              <select [(ngModel)]="publicacion.tipo_tejido" name="tipoTejido" required
                class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-medium focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none transition">
                <option value="Malla (Malharia)">Malla / Malharia (Canelado, Viscose, etc.)</option>
                <option value="Tejido Plano">Tejido Plano (Jeans, Camisería)</option>
                <option value="Ambos">Ambos tipos de tejido</option>
              </select>
            </div>
          </div>

          <!-- Modalidad (Feirinha / Firma) y Capacidad -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-blue-50/50 p-4 rounded-2xl border border-blue-100">
            <div>
              <label class="block text-xs font-bold text-blue-900 uppercase mb-1">📋 Modalidad de Servicio</label>
              <select [(ngModel)]="publicacion.modalidad_trabajo" name="modTrabajo" required
                class="w-full px-4 py-3 bg-white border border-blue-200 rounded-xl text-xs font-bold text-blue-900 outline-none">
                <option value="Feirinha">Solo Feirinha (Lotes rápidos)</option>
                <option value="Firma">Solo Firma (Producción continua)</option>
                <option value="Ambos">Ambos (Feirinha y Firma)</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-bold text-blue-900 uppercase mb-1">⚡ Capacidad Diaria / Lote</label>
              <input type="text" [(ngModel)]="publicacion.capacidad_produccion" name="capacidad" placeholder="Ej: 500 piezas / día" required
                class="w-full px-4 py-3 bg-white border border-blue-200 rounded-xl text-xs font-bold text-blue-900 outline-none">
            </div>
          </div>

          <!-- Ubicación y Logística Limpia -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-slate-600 uppercase mb-1">📍 Zona / Barrio</label>
              <select [(ngModel)]="publicacion.zona_ubicacion" name="zonaCorte" required
                class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-medium outline-none">
                <option value="Brás">Brás</option>
                <option value="Bom Retiro">Bom Retiro</option>
                <option value="Pari">Pari</option>
                <option value="Guarulhos">Guarulhos</option>
                <option value="Zona Leste">Zona Leste</option>
                <option value="Zona Norte">Zona Norte</option>
                <option value="Zona Sul">Zona Sul</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-600 uppercase mb-1">🚚 Logística de Transporte</label>
              <select [(ngModel)]="publicacion.logistica_entrega" name="logisticaCorte" class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-medium outline-none">
                <option value="oficina_retira">El taller pasa a recoger la carga</option>
                <option value="tienda_entrega">La tienda entrega en el taller</option>
                <option value="acuerdo_mutuo">A combinar entre las partes</option>
              </select>
            </div>
          </div>

        </div>

        <!-- ========================================================================= -->
        <!-- CASO B: CONTRATAR FUNCIONARIOS / EMPLEO                                  -->
        <!-- ========================================================================= -->
        <div *ngIf="publicacion.tipo_publicacion === 'busco_funcionario'" class="space-y-4 animate-fadeIn">
          
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Puesto Requerido</label>
              <select [(ngModel)]="publicacion.puesto_trabajo" name="puesto" required
                class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-medium outline-none">
                <option value="Costurero(a) Overlock/Reta">Costurero(a) Overlock / Reta</option>
                <option value="Costurero(a) Galoneira">Costurero(a) Galoneira</option>
                <option value="Casal de Costura">Casal de Costura (Pareja)</option>
                <option value="Planchador / Acabados">Planchador / Acabados</option>
                <option value="Empaque y Ventas">Empaque y Ventas</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Prenda Principal</label>
              <input type="text" [(ngModel)]="publicacion.titulo" name="prendaFunc" placeholder="Ej: Regatas, Vestidos" required
                class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-medium outline-none">
            </div>
          </div>

          <!-- Cards Alojamiento & Modalidad de Contrato -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-amber-50/60 p-4 rounded-2xl border border-amber-100">
            <div>
              <label class="block text-xs font-bold text-amber-900 uppercase mb-1">🏠 Modalidad Alojamiento</label>
              <select [(ngModel)]="publicacion.modalidad_alojamiento" name="alojamiento" required
                class="w-full px-4 py-3 bg-white border border-amber-200 rounded-xl text-xs font-bold text-amber-900 outline-none">
                <option value="cama_fuera">Cama Fuera (Turno diario)</option>
                <option value="cama_dentro">Cama Dentro (Vive en taller)</option>
                <option value="opcional">A convenir / Ambas</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-bold text-amber-900 uppercase mb-1">👥 Personal Buscado</label>
              <select [(ngModel)]="publicacion.modalidad_contratacion" name="contratacion" required
                class="w-full px-4 py-3 bg-white border border-amber-200 rounded-xl text-xs font-bold text-amber-900 outline-none">
                <option value="individual">Costurero(a) Individual</option>
                <option value="casal">Casal (Pareja de Costura)</option>
                <option value="equipo">Grupo / Equipo Completo</option>
              </select>
            </div>
          </div>

          <!-- Pago y Zona -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Tipo & Pago Estimado (R$)</label>
              <div class="flex gap-2">
                <select [(ngModel)]="publicacion.modalidad_pago" name="modPago" class="w-1/2 px-3 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-medium outline-none">
                  <option value="por_pieza">x Pieza</option>
                  <option value="salario_semanal">Semanal</option>
                  <option value="salario_mensual">Mensual</option>
                </select>
                <input type="number" step="0.01" [(ngModel)]="publicacion.pago_por_pieza" name="pagoFunc" placeholder="Ej: 1.50" required
                  class="w-1/2 px-3 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-medium outline-none">
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-600 uppercase mb-1">📍 Barrio / Taller</label>
              <select [(ngModel)]="publicacion.zona_ubicacion" name="zonaFunc" required
                class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-medium outline-none">
                <option value="Brás">Brás</option>
                <option value="Bom Retiro">Bom Retiro</option>
                <option value="Pari">Pari</option>
                <option value="Guarulhos">Guarulhos</option>
                <option value="Zona Leste">Zona Leste</option>
              </select>
            </div>
          </div>

          <!-- Switches / Checkboxes de Beneficios -->
          <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 flex flex-wrap gap-4">
            <label class="flex items-center gap-2.5 text-xs font-bold text-slate-700 cursor-pointer">
              <input type="checkbox" [(ngModel)]="publicacion.ofrece_alojamiento" name="alojamientoChk" class="w-4 h-4 rounded text-blue-600 focus:ring-0">
              <span>🏠 Vivienda Incluida</span>
            </label>
            <label class="flex items-center gap-2.5 text-xs font-bold text-slate-700 cursor-pointer">
              <input type="checkbox" [(ngModel)]="publicacion.ofrece_comida" name="comidaChk" class="w-4 h-4 rounded text-blue-600 focus:ring-0">
              <span>🍲 Comida Incluida</span>
            </label>
          </div>

        </div>

        <!-- ========================================================================= -->
        <!-- CASO C: TIENDA BUSCA TALLER (BUSCO_OFICINA)                              -->
        <!-- ========================================================================= -->
        <div *ngIf="publicacion.tipo_publicacion === 'busco_oficina'" class="space-y-4 animate-fadeIn">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Prenda / Lote</label>
              <input type="text" [(ngModel)]="publicacion.titulo" name="tituloLote" placeholder="Ej: Lote 2000 Vestidos Canelados" required
                class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-medium outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 uppercase mb-1">📍 Zona Entrega</label>
              <select [(ngModel)]="publicacion.zona_ubicacion" name="zonaLote" required
                class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-medium outline-none">
                <option value="Brás">Brás</option>
                <option value="Bom Retiro">Bom Retiro</option>
                <option value="Pari">Pari</option>
                <option value="Guarulhos">Guarulhos</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Cantidad Piezas</label>
              <input type="number" [(ngModel)]="publicacion.cantidad_piezas" name="cantLote" placeholder="Ej: 1500" required
                class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-medium outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Pago x Pieza (R$)</label>
              <input type="number" step="0.01" [(ngModel)]="publicacion.pago_por_pieza" name="pagoLote" placeholder="Ej: 1.20" required
                class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-medium outline-none">
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">🚚 Logística Carga</label>
            <select [(ngModel)]="publicacion.logistica_entrega" name="logisticaTienda" class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-medium outline-none">
              <option value="tienda_entrega">La tienda entrega la carga en el taller</option>
              <option value="oficina_retira">El taller pasa a recoger la carga</option>
              <option value="acuerdo_mutuo">A combinar</option>
            </select>
          </div>
        </div>

        <!-- MAQUINARIA UTILIZADA / REQUERIDA (CHIPS INTERACTIVOS ESTILO MOBILE) -->
        <div class="space-y-2 pt-2 border-t border-slate-100">
          <label class="block text-xs font-bold text-slate-600 uppercase">🧵 Maquinaria Requerida</label>
          
          <div class="flex flex-wrap gap-2">
            <button type="button" *ngFor="let maquina of maquinariaOficial"
              (click)="toggleMaquina(maquina.id)"
              [class.bg-blue-600]="isMaquinaSelected(maquina.id)"
              [class.text-white]="isMaquinaSelected(maquina.id)"
              [class.border-blue-600]="isMaquinaSelected(maquina.id)"
              [class.bg-slate-50]="!isMaquinaSelected(maquina.id)"
              [class.text-slate-700]="!isMaquinaSelected(maquina.id)"
              [class.border-slate-200]="!isMaquinaSelected(maquina.id)"
              class="px-3.5 py-2.5 rounded-xl text-xs font-bold border transition duration-150 active:scale-95 flex items-center gap-1.5">
              <span>{{ isMaquinaSelected(maquina.id) ? '✓' : '+' }}</span>
              <span>{{ maquina.nombre }}</span>
            </button>
          </div>
        </div>

        <!-- DESCRIPCIÓN EXTRA -->
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Notas Adicionales (Opcional)</label>
          <textarea [(ngModel)]="publicacion.descripcion" name="descripcion" rows="2" placeholder="Detalles de empaque, hilos especiales, horarios..."
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none transition"></textarea>
        </div>

        <!-- BOTÓN PUBLICAR ESTILO ANDROID FAB / BUTTON -->
        <button type="submit" 
          [disabled]="!pubForm.form.valid || cargando || publicacion.maquinas_requeridas.length === 0"
          class="w-full bg-slate-900 active:scale-[0.98] text-white font-black py-4 px-6 rounded-2xl shadow-xl shadow-slate-900/20 hover:bg-slate-800 transition duration-200 disabled:opacity-40 flex items-center justify-center gap-2">
          <span>{{ cargando ? 'Guardando en la nube...' : 'Publicar Anuncio Ahora' }}</span>
        </button>

      </form>
    </div>
  </div>
</div>
