<div class="min-h-screen bg-stone-50 px-4 py-6 text-slate-900">
  <div class="mx-auto max-w-2xl">

    <header class="mb-4 flex items-center justify-between">
      <div>
        <h1 class="text-xl font-bold">Nuevo anuncio</h1>
        <p class="text-sm text-slate-500">Publica en el marketplace textil de São Paulo.</p>
      </div>
      <button type="button" (click)="cancelarYVolver()" aria-label="Cerrar" [ngClass]="ui.btnSecundario" class="!px-2.5">
        <app-icon nombre="x" clase="w-4 h-4" />
      </button>
    </header>

    <!-- ===================================================== ÉXITO -->
    <section *ngIf="idCreado" [ngClass]="ui.card" class="space-y-4 p-6 text-center">
      <span class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-teal-50 text-teal-700">
        <app-icon nombre="check" clase="w-7 h-7" />
      </span>
      <div>
        <h2 class="text-lg font-bold">Anuncio publicado</h2>
        <p class="mt-1 text-sm text-slate-500">Comparte el texto en grupos de WhatsApp y redes.</p>
      </div>

      <pre class="max-h-60 overflow-y-auto whitespace-pre-wrap rounded-lg border border-stone-200 bg-stone-50 p-4 text-left font-sans text-sm text-slate-700">{{ textoGenerado }}</pre>

      <p *ngIf="mensajeError()" class="text-sm text-rose-700">{{ mensajeError() }}</p>

      <div class="flex flex-wrap justify-center gap-2">
        <button type="button" (click)="copiar()" [ngClass]="ui.btnOscuro">
          <app-icon [nombre]="copiado() ? 'check' : 'link'" clase="w-4 h-4" /> {{ copiado() ? 'Copiado' : 'Copiar texto' }}
        </button>
        <button type="button" (click)="compartirWhatsApp()" [ngClass]="ui.btnPrimario">
          <app-icon nombre="chat" clase="w-4 h-4" /> Enviar por WhatsApp
        </button>
        <a [routerLink]="['/trabajo', idCreado]" [ngClass]="ui.btnSecundario">Ver anuncio</a>
        <button type="button" (click)="cancelarYVolver()" [ngClass]="ui.btnSecundario">Volver al panel</button>
      </div>
    </section>

    <!-- ================================================== FORMULARIO -->
    <form *ngIf="!idCreado" (ngSubmit)="onSubmit()" #pubForm="ngForm" class="space-y-5">

      <div *ngIf="mensajeError()" role="alert" class="flex items-center gap-2 rounded-lg border border-rose-200 bg-rose-50 p-3 text-sm font-medium text-rose-700">
        <app-icon nombre="alert" clase="w-4 h-4 shrink-0" /> {{ mensajeError() }}
      </div>

      <!-- Tipo de anuncio -->
      <fieldset *ngIf="opciones.length > 0">
        <legend class="mb-2 text-sm font-bold">¿Qué quieres publicar?</legend>
        <div class="grid gap-2" [ngClass]="opciones.length > 1 ? 'sm:grid-cols-2' : ''">
          <button type="button" *ngFor="let o of opciones" (click)="elegirTipo(o.id)" [attr.aria-pressed]="tipo === o.id"
                  class="flex items-start gap-3 rounded-xl border p-3 text-left transition focus-visible:outline focus-visible:outline-2 focus-visible:outline-teal-600"
                  [ngClass]="tipo === o.id ? 'border-teal-600 bg-teal-50/60 ring-1 ring-teal-600' : 'border-stone-200 bg-white hover:border-stone-300'">
            <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg"
                  [ngClass]="tipo === o.id ? 'bg-teal-700 text-white' : 'bg-stone-100 text-slate-600'"><app-icon [nombre]="o.icono" clase="w-5 h-5" /></span>
            <span><span class="block text-sm font-bold">{{ o.titulo }}</span><span class="block text-xs text-slate-500">{{ o.ayuda }}</span></span>
          </button>
        </div>
      </fieldset>

      <div [ngClass]="ui.card" class="space-y-4 p-4">

        <!-- Título (todos) -->
        <label [ngClass]="ui.etiqueta">
          {{ tipo === 'busco_oficina' ? 'Prenda y lote' : (tipo === 'busco_corte' ? 'Título del servicio' : (tipo === 'busco_funcionario' ? 'Prenda principal' : 'Título de tu anuncio')) }}
          <input type="text" [(ngModel)]="publicacion.titulo" name="titulo" required [ngClass]="ui.inputGrande"
                 [placeholder]="tipo === 'busco_oficina' ? 'Ej: Lote 2000 vestidos canelados' : (tipo === 'busco_corte' ? 'Ej: Taller disponible para remeras' : (tipo === 'busco_funcionario' ? 'Ej: Regatas, vestidos' : 'Ej: Costurera con 8 años en malla'))">
        </label>

        <!-- Lote de tienda -->
        <div *ngIf="tipo === 'busco_oficina'" class="grid gap-3 sm:grid-cols-2">
          <label [ngClass]="ui.etiqueta">Cantidad de piezas
            <input type="number" min="1" [(ngModel)]="publicacion.cantidad_piezas" name="cantidad" required placeholder="1500" [ngClass]="ui.inputGrande"></label>
          <label [ngClass]="ui.etiqueta">Pago por pieza (R$)
            <input type="number" min="0.01" step="0.01" [(ngModel)]="publicacion.pago_por_pieza" name="pagoLote" required placeholder="1.20" [ngClass]="ui.inputGrande"></label>
        </div>

        <!-- Taller libre -->
        <ng-container *ngIf="tipo === 'busco_corte'">
          <div class="grid gap-3 sm:grid-cols-2">
            <label [ngClass]="ui.etiqueta">Especialidad del taller
              <select [(ngModel)]="publicacion.especialidad_taller" name="especialidad" [ngClass]="ui.inputGrande">
                <option>Costura y Confeccion Completa</option><option>Oficina de Corte</option><option>Caseadeira y Botoneira</option>
                <option>Estampado y Sublimacion</option><option>Acabados y Plancha</option><option>Empaque y Etiquetado</option>
              </select></label>
            <label [ngClass]="ui.etiqueta">Tipo de tejido
              <select [(ngModel)]="publicacion.tipo_tejido" name="tejido" [ngClass]="ui.inputGrande">
                <option>Malla (Malharia)</option><option>Tejido Plano</option><option>Ambos</option>
              </select></label>
            <label [ngClass]="ui.etiqueta">Modalidad de servicio
              <select [(ngModel)]="publicacion.modalidad_trabajo" name="modalidad" [ngClass]="ui.inputGrande">
                <option value="Feirinha">Solo feirinha (lotes rápidos)</option><option value="Firma">Solo firma (producción continua)</option><option value="Ambos">Ambos</option>
              </select></label>
            <label [ngClass]="ui.etiqueta">Capacidad por día o lote
              <input type="text" [(ngModel)]="publicacion.capacidad_produccion" name="capacidad" required placeholder="Ej: 500 piezas por día" [ngClass]="ui.inputGrande"></label>
          </div>
        </ng-container>

        <!-- Vacante y disponibilidad -->
        <ng-container *ngIf="tipo === 'busco_funcionario' || tipo === 'busco_trabajo'">
          <div class="grid gap-3 sm:grid-cols-2">
            <label [ngClass]="ui.etiqueta">{{ tipo === 'busco_funcionario' ? 'Puesto requerido' : 'Tu especialidad' }}
              <select [(ngModel)]="publicacion.puesto_trabajo" name="puesto" [ngClass]="ui.inputGrande">
                <option>Costurero(a) Overlock/Reta</option><option>Costurero(a) Galoneira</option><option>Casal de Costura</option>
                <option>Planchador / Acabados</option><option>Empaque y Ventas</option>
              </select></label>
            <label [ngClass]="ui.etiqueta">{{ tipo === 'busco_funcionario' ? 'Alojamiento' : 'Alojamiento que necesitas' }}
              <select [(ngModel)]="publicacion.modalidad_alojamiento" name="alojamiento" [ngClass]="ui.inputGrande">
                <option value="cama_fuera">Cama fuera (turno diario)</option><option value="cama_dentro">Cama dentro (vive en el taller)</option><option value="opcional">A convenir</option>
              </select></label>
            <label [ngClass]="ui.etiqueta">{{ tipo === 'busco_funcionario' ? 'Personal buscado' : 'Cómo trabajas' }}
              <select [(ngModel)]="publicacion.modalidad_contratacion" name="contratacion" [ngClass]="ui.inputGrande">
                <option value="individual">Individual</option><option value="casal">Casal (pareja de costura)</option><option value="equipo">Grupo o equipo completo</option>
              </select></label>
            <label [ngClass]="ui.etiqueta">{{ tipo === 'busco_funcionario' ? 'Hijos que admites' : 'Hijos que viven contigo' }}
              <select [(ngModel)]="publicacion.cantidad_hijos_permitidos" name="hijos" [ngClass]="ui.inputGrande">
                <option [ngValue]="0">{{ tipo === 'busco_funcionario' ? 'Solo sin hijos' : 'Ninguno' }}</option>
                <option [ngValue]="1">1</option><option [ngValue]="2">2</option><option [ngValue]="3">3</option>
                <option [ngValue]="4">4</option><option [ngValue]="5">5</option><option [ngValue]="6">6 o más</option>
              </select></label>
          </div>

          <div class="grid gap-3 sm:grid-cols-2">
            <label [ngClass]="ui.etiqueta">Tipo de pago
              <select [(ngModel)]="publicacion.modalidad_pago" name="modPago" [ngClass]="ui.inputGrande">
                <option value="por_pieza">Por pieza</option><option value="salario_semanal">Semanal</option><option value="salario_mensual">Mensual</option>
              </select></label>
            <label [ngClass]="ui.etiqueta">{{ tipo === 'busco_funcionario' ? 'Pago estimado (R$)' : 'Pago esperado (R$, opcional)' }}
              <input type="number" min="0" step="0.01" [(ngModel)]="publicacion.pago_por_pieza" name="pagoFunc" [required]="tipo === 'busco_funcionario'" placeholder="1.50" [ngClass]="ui.inputGrande"></label>
          </div>
        </ng-container>

        <!-- Beneficios (sólo vacante) -->
        <fieldset *ngIf="tipo === 'busco_funcionario'">
          <legend class="mb-2 text-xs font-medium text-slate-700">Qué ofreces</legend>
          <div class="grid grid-cols-2 gap-2">
            <label class="flex cursor-pointer items-center gap-2 rounded-lg border border-stone-200 px-3 py-2 text-sm"><input type="checkbox" [(ngModel)]="publicacion.ofrece_alojamiento" name="chkAloj" class="h-4 w-4 accent-teal-700"> Vivienda</label>
            <label class="flex cursor-pointer items-center gap-2 rounded-lg border border-stone-200 px-3 py-2 text-sm"><input type="checkbox" [(ngModel)]="publicacion.ofrece_comida" name="chkComida" class="h-4 w-4 accent-teal-700"> Comida</label>
            <label class="flex cursor-pointer items-center gap-2 rounded-lg border border-stone-200 px-3 py-2 text-sm"><input type="checkbox" [(ngModel)]="publicacion.ofrece_wifi" name="chkWifi" class="h-4 w-4 accent-teal-700"> Wi-Fi libre</label>
            <label class="flex cursor-pointer items-center gap-2 rounded-lg border border-stone-200 px-3 py-2 text-sm"><input type="checkbox" [(ngModel)]="publicacion.ofrece_banio_privado" name="chkBanio" class="h-4 w-4 accent-teal-700"> Baño privado</label>
          </div>
        </fieldset>

        <!-- Zona y logística -->
        <div class="grid gap-3 sm:grid-cols-2">
          <label [ngClass]="ui.etiqueta">Zona o barrio
            <select [(ngModel)]="publicacion.zona_ubicacion" name="zona" required [ngClass]="ui.inputGrande">
              <option *ngFor="let z of zonas" [value]="z">{{ z }}</option>
            </select></label>
          <label *ngIf="tipo === 'busco_oficina' || tipo === 'busco_corte'" [ngClass]="ui.etiqueta">Logística de transporte
            <select [(ngModel)]="publicacion.logistica_entrega" name="logistica" [ngClass]="ui.inputGrande">
              <option value="oficina_retira">El taller retira la carga</option>
              <option value="tienda_entrega">La tienda entrega en el taller</option>
              <option value="acuerdo_mutuo">A combinar</option>
            </select></label>
        </div>
      </div>

      <!-- Máquinas -->
      <fieldset [ngClass]="ui.card" class="p-4">
        <legend class="sr-only">{{ etiquetaMaquinas }}</legend>
        <p class="mb-2 text-sm font-bold">{{ etiquetaMaquinas }}</p>
        <div class="flex flex-wrap gap-2">
          <button type="button" *ngFor="let m of maquinaria" (click)="toggleMaquina(m.id)" [attr.aria-pressed]="isMaquinaSelected(m.id)"
                  class="inline-flex items-center gap-1.5 rounded-lg border px-3 py-2 text-sm font-semibold transition active:scale-95 focus-visible:outline focus-visible:outline-2 focus-visible:outline-teal-600"
                  [ngClass]="isMaquinaSelected(m.id) ? 'border-teal-700 bg-teal-700 text-white' : 'border-stone-300 bg-white text-slate-700 hover:bg-stone-50'">
            <app-icon [nombre]="isMaquinaSelected(m.id) ? 'check' : 'plus'" clase="w-3.5 h-3.5" /> {{ m.nombre }}
          </button>
        </div>
      </fieldset>

      <!-- Notas -->
      <label [ngClass]="ui.etiqueta">Notas adicionales (opcional)
        <textarea [(ngModel)]="publicacion.descripcion" name="descripcion" rows="3" placeholder="Empaque, hilos especiales, horarios..." [ngClass]="ui.inputGrande"></textarea>
      </label>

      <div class="flex gap-3">
        <button type="button" (click)="cancelarYVolver()" [ngClass]="ui.btnSecundario" class="w-1/3 !py-3">Cancelar</button>
        <button type="submit" [disabled]="!pubForm.form.valid || cargando()" [ngClass]="ui.btnPrimario" class="w-2/3 !py-3">
          {{ cargando() ? 'Publicando...' : 'Publicar anuncio' }}
        </button>
      </div>
    </form>
  </div>
</div>
