<div class="min-h-screen bg-gray-50 py-8 px-4">
  <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
    
    <div class="p-6 md:p-8">
      <h2 class="text-2xl font-bold text-gray-900 mb-6">Publicar Nuevo Trabajo</h2>

      <!-- PANTALLA DE ÉXITO (Se muestra después de publicar) -->
      <div *ngIf="publicacionExitosa" class="text-center py-8">
        <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-green-100 mb-4">
          <svg class="h-8 w-8 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
          </svg>
        </div>
        <h3 class="text-xl font-bold text-gray-900 mb-2">¡Corte Publicado con Éxito!</h3>
        <p class="text-gray-500 mb-6">Copia este anuncio estratégico y pégalo en grupos de Facebook o WhatsApp para conseguir oficinas rápido.</p>
        
        <div class="bg-gray-50 p-4 rounded-lg text-left text-sm text-gray-700 whitespace-pre-line border border-gray-200 mb-6">
          {{ textoGenerado }}
        </div>

        <button (click)="copiarAlPortapapeles()" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-xl hover:bg-blue-700 transition">
          Copiar Texto y Volver al Panel
        </button>
      </div>


      <!-- FORMULARIO DE PUBLICACIÓN -->
      <form *ngIf="!publicacionExitosa" (ngSubmit)="onSubmit()" #pubForm="ngForm" class="space-y-6">
        
        <div *ngIf="mensajeError" class="bg-red-100 text-red-700 p-3 rounded-lg text-sm">
          {{ mensajeError }}
        </div>

        <!-- Tipo y Título -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Tipo de Búsqueda</label>
            <select [(ngModel)]="publicacion.tipo_publicacion" name="tipo" class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="busco_oficina">Tengo corte (Busco Oficina)</option>
              <option value="busco_funcionario">Tengo máquinas (Busco Funcionario)</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Prenda / Título</label>
            <input type="text" [(ngModel)]="publicacion.titulo" name="titulo" placeholder="Ej: Regatas de canelado" required
              class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
        </div>

        <!-- Cantidad y Pago -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Cantidad de piezas</label>
            <input type="number" [(ngModel)]="publicacion.cantidad_piezas" name="cantidad" placeholder="Ej: 1500" required
              class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Pago por pieza (R$)</label>
            <input type="number" step="0.01" [(ngModel)]="publicacion.pago_por_pieza" name="pago" placeholder="Ej: 1.20" required
              class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
        </div>

        <div class="mb-6">
  <label class="block text-sm font-bold text-gray-700 mb-2">Maquinaria Requerida (Selecciona las necesarias)</label>
  <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 bg-gray-50 p-4 rounded-xl border border-gray-200">
    <label *ngFor="let maquina of maquinariaOficial" class="flex items-center space-x-3 cursor-pointer p-2 hover:bg-gray-100 rounded-lg transition">
      <input type="checkbox" [value]="maquina.id" (change)="onMaquinaChange($event)" class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
      <span class="text-sm font-medium text-gray-700">{{ maquina.nombre }}</span>
    </label>
  </div>
</div>

        <!-- Descripción Extra -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Instrucciones o Acabados (Opcional)</label>
          <textarea [(ngModel)]="publicacion.descripcion" name="descripcion" rows="3" placeholder="Detalles de empaque, hilos especiales, etc."
            class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
        </div>

        <!-- Botón Publicar -->
        <button type="submit" [disabled]="!pubForm.form.valid || cargando || publicacion.maquinas_requeridas.length === 0"
          class="w-full bg-gray-900 text-white font-bold py-4 px-4 rounded-xl hover:bg-gray-800 transition duration-200 disabled:opacity-50 mt-4 shadow-lg shadow-gray-200">
          {{ cargando ? 'Guardando en la nube...' : 'Publicar Corte' }}
        </button>

      </form>
    </div>
  </div>
</div>
