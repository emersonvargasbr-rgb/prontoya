<div class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Únete a la Plataforma</h2>
    
    <!-- Mensaje de error si algo falla -->
    <div *ngIf="mensajeError" class="bg-red-100 text-red-700 p-3 rounded-lg text-sm mb-4">
      {{ mensajeError }}
    </div>

    <form (ngSubmit)="onSubmit()" #registroForm="ngForm" class="space-y-4">
      
      <!-- Selección de Rol -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">¿Qué perfil tienes?</label>
        <select [(ngModel)]="usuario.rol" name="rol" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
          <option value="funcionario">Costurero / Operario</option>
          <option value="oficina">Oficina de Costura</option>
          <option value="tienda">Tienda / Marca</option>
        </select>
      </div>

      <!-- Datos Personales -->
      <div>
        <input type="text" [(ngModel)]="usuario.nombre_completo" name="nombre" placeholder="Nombre completo o Empresa" required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div>
        <input type="text" [(ngModel)]="usuario.documento" name="documento" placeholder="CPF o CNPJ" required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div>
        <input type="tel" [(ngModel)]="usuario.telefono" name="telefono" placeholder="WhatsApp (Ej: 11999999999)" required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <!-- Accesos -->
      <div>
        <input type="email" [(ngModel)]="usuario.email" name="email" placeholder="Correo electrónico" required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div>
        <input type="password" [(ngModel)]="usuario.password" name="password" placeholder="Contraseña (mínimo 6 letras)" required minlength="6"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <!-- Botón de Enviar -->
      <button type="submit" [disabled]="!registroForm.form.valid || cargando"
        class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition duration-200 disabled:opacity-50">
        {{ cargando ? 'Registrando...' : 'Crear mi cuenta' }}
      </button>

    </form>
  </div>
</div>
