<div class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Iniciar Sesión</h2>
    
    <div *ngIf="mensajeError" class="bg-red-100 text-red-700 p-3 rounded-lg text-sm mb-4">
      {{ mensajeError }}
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico</label>
        <input type="email" [(ngModel)]="credenciales.email" name="email" required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
        <input type="password" [(ngModel)]="credenciales.password" name="password" required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <button type="submit" [disabled]="!loginForm.form.valid || cargando"
        class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition duration-200 disabled:opacity-50 mt-4">
        {{ cargando ? 'Entrando...' : 'Ingresar' }}
      </button>
    </form>

    <div class="mt-6 text-center text-sm text-gray-600">
      ¿No tienes cuenta? <a routerLink="/registro" class="text-blue-600 font-bold hover:underline">Regístrate aquí</a>
    </div>
  </div>
</div>
