<!-- Pestañas de Navegación (Añadir botón Mis Publicaciones) -->
<div class="flex border-b border-gray-200 bg-white rounded-t-2xl px-6 pt-4 gap-6 overflow-x-auto">
  <button (click)="pestanaActiva = 'solicitudes'" [class.border-blue-600]="pestanaActiva === 'solicitudes'" class="pb-4 font-bold text-sm border-b-2 border-transparent text-gray-500 hover:text-gray-800 flex items-center">
    📥 Solicitudes Entrantes ({{ solicitudesPendientes.length }})
  </button>
  <button (click)="pestanaActiva = 'en_proceso'" [class.border-blue-600]="pestanaActiva === 'en_proceso'" class="pb-4 font-bold text-sm border-b-2 border-transparent text-gray-500 hover:text-gray-800 flex items-center">
    🏭 En Producción ({{ lotesEnProceso.length }})
  </button>
  <button (click)="pestanaActiva = 'mis_publicaciones'" [class.border-blue-600]="pestanaActiva === 'mis_publicaciones'" class="pb-4 font-bold text-sm border-b-2 border-transparent text-gray-500 hover:text-gray-800 flex items-center">
    📢 Mis Lotes Publicados ({{ misPublicaciones.length }})
  </button>
</div>

<!-- Contenido Pestaña Mis Anuncios Tienda -->
<div *ngIf="!cargando && pestanaActiva === 'mis_publicaciones'" class="space-y-4">
  <div *ngFor="let pub of misPublicaciones" class="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm flex items-center justify-between">
    <div>
      <h4 class="font-bold text-gray-900">{{ pub.titulo }}</h4>
      <p class="text-sm text-gray-500">Piezas: {{ pub.cantidad_piezas }} | Estado: <span class="uppercase font-bold">{{ pub.estado }}</span></p>
    </div>
    <div class="flex items-center gap-2">
      <button (click)="cambiarEstadoAnuncio(pub)" class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-xs font-bold rounded-xl">
        {{ pub.estado === 'Activo' ? 'Pausar' : 'Activar' }}
      </button>
      <button (click)="eliminarAnuncio(pub.id)" class="px-3 py-1.5 bg-red-50 hover:bg-red-100 text-red-600 text-xs font-bold rounded-xl">
        Eliminar
      </button>
    </div>
  </div>
</div>
